[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hail-detector"
version = "0.1.0"
description = "A cautious radar-signature hail detector for a configured Sofia location."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "h5py>=3.11,<4",
    "httpx>=0.28,<1",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "pyproj>=3.6,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hail-detector-poller = "hail_detector.poller:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hail_detector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
